<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dark Companion</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #1a1a1a;
            --accent: #d4af37; /* Gold like the watch/emerald tablet */
            --text: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            background: var(--panel);
            border-bottom: 2px solid var(--accent);
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .tabs {
            display: flex;
            background: #111;
            overflow-x: auto;
            border-bottom: 1px solid #333;
        }
        .tab {
            padding: 12px 20px;
            min-width: 80px;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            border-right: 1px solid #222;
            white-space: nowrap;
        }
        .tab.active {
            background: var(--panel);
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        textarea {
            flex-grow: 1;
            padding: 20px;
            background: transparent;
            color: var(--text);
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
        }
        .footer {
            padding: 8px 15px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            background: var(--panel);
            color: #666;
        }
    </style>
</head>
<body>

<header>Sic Mundus Creatus Est</header>

<div class="tabs" id="tabContainer">
    <div class="tab active" onclick="switchTab('General')">General</div>
    <div class="tab" onclick="switchTab('Families')">Families</div>
    <div class="tab" onclick="switchTab('Timelines')">Years</div>
    <div class="tab" onclick="switchTab('Theories')">Theories</div>
</div>

<textarea id="noteArea" placeholder="Everything is connected..."></textarea>

<div class="footer">
    <span id="saveStatus">Saved</span>
    <span>Dark Notebook v2.0</span>
</div>

<script>
    const noteArea = document.getElementById('noteArea');
    const saveStatus = document.getElementById('saveStatus');
    let currentTab = 'General';

    // Load initial data
    function loadData() {
        const savedData = localStorage.getItem('dark_notes_' + currentTab);
        noteArea.value = savedData || "";
    }

    function switchTab(tabName) {
        // Save current before switching
        localStorage.setItem('dark_notes_' + currentTab, noteArea.value);
        
        // Update UI
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('active');
            if(t.innerText === tabName) t.classList.add('active');
        });

        // Load new tab data
        currentTab = tabName;
        loadData();
    }

    noteArea.addEventListener('input', () => {
        saveStatus.innerText = "Syncing...";
        localStorage.setItem('dark_notes_' + currentTab, noteArea.value);
        setTimeout(() => { saveStatus.innerText = "Saved"; }, 500);
    });

    loadData();
</script>

</body>
</html>
